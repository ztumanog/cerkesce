# ============================================
# Docker Compose - Development
# Phase 8.2.1: ADR-GOV-011 Hybrid Mimari
# ============================================

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cerkesce-next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_URL=http://express-api:3001
    depends_on:
      express-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - cerkesce-net

  express-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cerkesce-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - cerkesce-net

  redis:
    image: redis:7-alpine
    container_name: cerkesce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cerkesce-net

volumes:
  redis-data:
    driver: local

networks:
  cerkesce-net:
    driver: bridge
