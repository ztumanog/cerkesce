name: Cerkesce Platformu CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Ortamini Hazirla
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bagimliliklari Yukle
        run: npm ci

      - name: 1. Statik Tip Kontrolu (TypeScript Check)
        run: npx tsc --noEmit

      - name: 2. Test Otomasyonu (Vitest Active Tests)
        run: npm test

      - name: 3. Uretim Derleme Kontrolu (Build Gate Check)
        run: npm run build