name: Çerkesçe Platformu CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Ortamını Hazırla
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: 1. Statik Tip Kontrolü (TypeScript Check)
        run: npx tsc --noEmit

      - name: 2. Test Otomasyonu (Vitest Active Tests)
        run: npm test -- --run

      - name: 3. Üretim Derleme Kontrolü (Build Gate Check)
        run: npm run build
              - name: 2. Test Otomasyonu (Vitest Active Tests)
        run: npm test